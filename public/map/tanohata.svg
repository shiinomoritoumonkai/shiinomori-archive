<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 2400 1800">
  <!-- 仮のマップ画像（田野畑村のイラストマップが届くまでの代用）。実物に差し替えるときは config/map.json の width/height も合わせる -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFD8E6"/><stop offset="1" stop-color="#9FC2D6"/></linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DCE8D4"/><stop offset="1" stop-color="#CFE0C6"/></linearGradient>
  </defs>
  <rect width="2400" height="1800" fill="url(#sea)"/>
  <!-- 陸地（東側が海） -->
  <path d="M0,0 H1900 C1980,140 1960,300 2040,420 C2110,520 2060,640 2110,760 C2160,880 2080,980 2140,1100 C2200,1220 2120,1360 2180,1480 C2220,1580 2160,1700 2200,1800 H0 Z" fill="url(#land)"/>
  <!-- 海岸の砂 -->
  <path d="M1900,0 C1980,140 1960,300 2040,420 C2110,520 2060,640 2110,760 C2160,880 2080,980 2140,1100 C2200,1220 2120,1360 2180,1480 C2220,1580 2160,1700 2200,1800" fill="none" stroke="#EADFBF" stroke-width="28"/>
  <!-- 山（西側） -->
  <g fill="#B9CFAE">
    <path d="M100,700 L400,320 L700,700 Z"/><path d="M500,900 L820,480 L1140,900 Z"/><path d="M200,1250 L480,860 L760,1250 Z"/><path d="M900,520 L1120,260 L1340,520 Z"/><path d="M700,1500 L1000,1100 L1300,1500 Z"/>
  </g>
  <g fill="#A3BF98">
    <path d="M250,700 L400,440 L550,700 Z"/><path d="M660,900 L820,620 L980,900 Z"/><path d="M340,1250 L480,1000 L620,1250 Z"/><path d="M1000,520 L1120,360 L1240,520 Z"/><path d="M850,1500 L1000,1250 L1150,1500 Z"/>
  </g>
  <!-- 森 -->
  <g fill="#8FB58A" opacity=".8">
    <circle cx="1500" cy="700" r="150"/><circle cx="1640" cy="640" r="120"/><circle cx="1400" cy="820" r="110"/><circle cx="1560" cy="860" r="130"/>
    <circle cx="1200" cy="640" r="90"/><circle cx="1300" cy="560" r="80"/>
  </g>
  <!-- 川 -->
  <path d="M300,1800 C500,1600 700,1650 900,1450 C1100,1250 1300,1350 1500,1200 C1700,1050 1800,1100 2080,1000" fill="none" stroke="#9FC2D6" stroke-width="26" stroke-linecap="round"/>
  <!-- 道路 -->
  <path d="M1200,0 C1300,300 1350,600 1500,900 C1650,1200 1700,1500 1850,1800" fill="none" stroke="#FFFFFF" stroke-width="22"/>
  <path d="M800,1800 C1000,1500 1300,1400 1560,1230 C1800,1080 1900,1000 2100,920" fill="none" stroke="#FFFFFF" stroke-width="16"/>
  <path d="M1200,560 C1400,620 1500,760 1480,960" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <!-- 集落 -->
  <g fill="#E8E2D2" stroke="#C9C0A8" stroke-width="3">
    <rect x="1440" y="1060" width="48" height="40"/><rect x="1500" y="1080" width="40" height="36"/><rect x="1560" y="1050" width="44" height="40"/>
    <rect x="1860" y="1180" width="48" height="40"/><rect x="1920" y="1200" width="40" height="36"/><rect x="1980" y="1170" width="44" height="40"/>
    <rect x="1920" y="700" width="48" height="40"/><rect x="1980" y="720" width="40" height="36"/>
  </g>
  <text x="2240" y="900" font-family="sans-serif" font-size="56" fill="#5F7F96" transform="rotate(90 2240 900)" text-anchor="middle">太平洋</text>
  <text x="60" y="120" font-family="sans-serif" font-size="44" fill="#6B7280">仮のマップ画像（田野畑村のイラストマップに差し替え予定）</text>
</svg>

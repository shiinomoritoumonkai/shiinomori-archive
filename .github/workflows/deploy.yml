# SPEC §12.2
# - pull_request：フィクスチャでテストとビルドだけ（秘密の値は使わない）
# - main への push と手動実行：テスト → 実データで ingest build → ビルド → check:public → Pages へデプロイ
# - 手動実行で source=fixtures を選ぶと、仮データ（フィクスチャ）でデプロイする（Secrets 不要。Drive の準備前にサイトの形を見るため）
name: build-and-deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source:
        description: 'データの元（drive = 実データ、fixtures = 仮データのデモ）'
        type: choice
        default: drive
        options: [drive, fixtures]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  PAGES_BASE: ${{ vars.PAGES_BASE || format('/{0}/', github.event.repository.name) }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:prepare
      - run: pnpm e2e
      - run: pnpm check:public
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ingest from Drive (counts only in logs)
        if: inputs.source != 'fixtures'
        run: pnpm ingest build
        env:
          CI: 'true'
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_KEY_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_B64 }}
          DRIVE_ARCHIVE_ROOT_ID: ${{ secrets.DRIVE_ARCHIVE_ROOT_ID }}
          DRIVE_MAP_ROOT_ID: ${{ secrets.DRIVE_MAP_ROOT_ID }}
      - name: Build data from fixtures (demo)
        if: inputs.source == 'fixtures'
        run: pnpm fixtures && pnpm ingest build --from fixtures/listing.json
        env:
          CI: 'true'
          SITE_PASSWORD: demo-shiinomori-2026
      - run: pnpm build
        env:
          VITE_PHOTO_SOURCE: ${{ inputs.source == 'fixtures' && 'local' || '' }}
      - run: pnpm check:public
        env:
          DRIVE_ARCHIVE_ROOT_ID: ${{ secrets.DRIVE_ARCHIVE_ROOT_ID }}
          DRIVE_MAP_ROOT_ID: ${{ secrets.DRIVE_MAP_ROOT_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Wait until the artifact is visible (avoids a transient "No artifacts" failure)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 12); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name' | grep -qx github-pages; then exit 0; fi
            sleep 5
          done
          echo "artifact not visible yet; continuing anyway"
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      # GitHub 側で成果物が一時的に見えないことがある（"No artifacts named github-pages"）。30 秒おいて 1 回だけやり直す
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
